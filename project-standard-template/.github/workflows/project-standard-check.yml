name: Project Standard Check

on:
  push:
  pull_request:

jobs:
  template-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile standard scripts
        run: |
          python -m py_compile scripts/doctor.py scripts/verify.py scripts/usage.py

      - name: Validate project config JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('.project/config.json').read_text(encoding='utf-8'))
          print('config.json: PASS')
          PY

      - name: Run project doctor
        run: python scripts/doctor.py

      - name: Generate empty usage report
        run: python scripts/usage.py report
